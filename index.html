<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simple ToDo List</title>
  <link rel="stylesheet" href="style.css" type="text/css" media="all" />
</head>

<body>
  
  <div class="container">
    <div class="heading">Simple ToDo list
    </div>
    <div class="line"></div>
    <div class="section">
      <div class="heading2">
        Add Items :
      </div>
      <div class="inputDivElement">
        <input type="text" name="inputBox" id="inputBox" placeholder="enter item name"/>
        <button id="addButton">Add</button>
      </div>
    </div>
    <div class="line"></div>
    <div class="section">
      <div class="heading2">
        Item List :
      </div>
      <div class="listArea">
      </div>
    </div>
  </div>
  
  <script src="script.js"></script>
</body>

</html>
